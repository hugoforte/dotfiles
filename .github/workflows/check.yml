name: Check

# windows-latest and macos-latest, one job each, and no other OS (docs/adr/0006).
#
# The Windows job is the evidence for the Windows machines. These scripts run under Windows
# PowerShell 5.1 and Git Bash there, and both defects this repo has actually shipped were
# invisible anywhere else: `Write-Host` does not survive `| Out-String` under 5.1
# (hugoforte/dotfiles#9), and jq on Windows emits CRLF into a repo whose .gitattributes demands
# LF (#8). A Linux runner passes both vacuously, which is worse than not testing them at all -
# it looks like coverage.
#
# For the same reason every PowerShell step is `shell: powershell` (5.1), never `pwsh` (7.x):
# 5.1 is what the scheduled task runs. `shell: bash` on this runner is Git Bash, which is what
# sync.ps1 finds and uses.
#
# The macOS job is the evidence for the Mac, which runs the sh half of this repo with no MSYS
# in the way: plain `ln -s`, BSD userland, and /bin/sh, bash 3.2 in POSIX mode. It runs that
# half only; the PowerShell scripts configure Windows and have nothing to prove on a Mac.
#
# Nothing here may run an installer. setup.ps1, sync.ps1, install-sync-task.ps1, and
# install-tools.ps1 / deploy-secrets.ps1 without -Check all mutate the machine they run on.
# The seam that would make those testable is hugoforte/dotfiles#11.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # The leak check reads the pull request's title, body and commit messages.
  pull-requests: read

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Shell syntax
        shell: bash
        run: |
          status=0
          for f in $(git ls-files '*.sh'); do
            sh -n "$f" || { echo "syntax error: $f"; status=1; }
          done
          exit $status

      # Before anything slower: a private term or an address must not merge. The terms are the
      # LEAK_CHECK_TERMS secret, which a fork's pull request does not get, so there it runs the
      # generic rules alone. A finding names where, never what (ai/helpers/leak-check.sh).
      - name: Leak check
        shell: bash
        env:
          LEAK_CHECK_TERMS: ${{ secrets.LEAK_CHECK_TERMS }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: sh bin/leak-check ${PR:+--pr "$PR"}

      - name: PowerShell syntax
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in (git ls-files '*.ps1')) {
            try { $null = [scriptblock]::Create((Get-Content $f -Raw)) }
            catch { Write-Host "parse error: $f -> $($_.Exception.Message)"; $bad++ }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Shell tests
        shell: bash
        run: |
          jq --version
          sh tests/run.sh

      - name: PowerShell tests
        shell: powershell
        run: |
          # The runner image usually ships Pester 5; install only when it does not, because
          # Install-Module is slow and the built-in 3.4 cannot run these tests.
          $have = Get-Module -ListAvailable Pester |
                  Where-Object { $_.Version.Major -ge 5 } |
                  Select-Object -First 1
          if (-not $have) {
            Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }
          .\tests\Run-Pester.ps1 -CI

      - name: Markdown
        shell: bash
        # An allowlist of the docs this repo writes, not the whole tree. .github/prompts,
        # ai/agents and ai/skills are generated or vendored - 234 findings between them, none
        # of them ours to fix - and a linter that is always red gets ignored. That is the same
        # reasoning powershell/markdownlint.jsonc gives for being an allowlist of rules.
        #
        # Unpinned, matching how powershell/tools.psd1 declares markdownlint-cli2.
        run: |
          npx --yes markdownlint-cli2 --config powershell/markdownlint.jsonc \
            "*.md" \
            ".github/instructions/**/*.md" \
            "ai/*.md" \
            "ai/secrets/**/*.md" \
            "docs/**/*.md" \
            "powershell/**/*.md" \
            "tests/**/*.md"

  check-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      # `sh` here is /bin/sh, the shell a Mac runs these scripts with, not Git Bash. -e as GitHub's
      # default sh shell has, so a missing jq stops the step rather than failing tests obscurely.
      - name: Shell syntax
        shell: sh -e {0}
        run: |
          status=0
          for f in $(git ls-files '*.sh'); do
            sh -n "$f" || { echo "syntax error: $f"; status=1; }
          done
          exit $status

      - name: Shell tests
        shell: sh -e {0}
        run: |
          jq --version
          sh tests/run.sh
